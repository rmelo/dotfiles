# --------------------------------------------------
# STEP 1: INSTALL PACKAGES ON FEDORA / RHEL
# --------------------------------------------------
- name: Install Zsh and Git on Fedora / RHEL
  ansible.builtin.dnf:
    name:
      - zsh
      - git
    state: present
  become: true
  when: ansible_facts["os_family"] == "RedHat"

# --------------------------------------------------
# STEP 2: INSTALL PACKAGES ON MACOS
# --------------------------------------------------
- name: Install Zsh and Git on macOS
  community.general.homebrew:
    name:
      - zsh
      - git
    state: present
  when: ansible_facts["os_family"] == "Darwin"
# --------------------------------------------------
# STEP 3: SET DEFAULT SHELL
# --------------------------------------------------
- name: Set Zsh as the default shell (macOS - Homebrew zsh)
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /opt/homebrew/bin/zsh
  become: true
  when: ansible_facts["os_family"] == "Darwin"

- name: Set Zsh as the default shell (Linux)
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /bin/zsh
  become: true
  when: ansible_facts["os_family"] == "RedHat"

# --------------------------------------------------
# STEP 4: INSTALL OH MY ZSH
# --------------------------------------------------
- name: Install Oh My Zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh"
    depth: 1
