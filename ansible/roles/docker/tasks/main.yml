# --------------------------------------------------
# STEP 1: INSTALL DOCKER ON MACOS (Docker Desktop)
# --------------------------------------------------
- name: macOS | Ensure /usr/local/cli-plugins exists
  ansible.builtin.file:
    path: /usr/local/cli-plugins
    state: directory
    mode: '0755'
  become: true
  tags: docker
  when: ansible_facts["os_family"] == "Darwin"

- name: macOS | Install Docker Desktop
  community.general.homebrew_cask:
    name: docker
    state: present
  tags: docker
  when: ansible_facts["os_family"] == "Darwin"

# --------------------------------------------------
# STEP 2: INSTALL DOCKER ON FEDORA / RHEL
# --------------------------------------------------
- name: Fedora | Add Docker repository
  ansible.builtin.command:
    cmd: dnf config-manager --add-repo https://download.docker.com/linux/fedora/docker-ce.repo
  become: true
  when: ansible_facts["os_family"] == "RedHat"

- name: Fedora | Install Docker CE
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  become: true
  when: ansible_facts["os_family"] == "RedHat"

- name: Fedora | Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  become: true
  when: ansible_facts["os_family"] == "RedHat"

- name: Fedora | Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: docker
    append: true
  become: true
  when: ansible_facts["os_family"] == "RedHat"
